<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humba Pickleball League — Ratings</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

:root{
  --bg: #F5F1E3;
  --surface: #FFFFFF;
  --surface-2: #EFEADA;
  --line: #2F5233;
  --ball: #2F5233;
  --coral: #B5482C;
  --muted: #77816B;
  --text: #2A2F1F;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}
::selection{background: var(--ball); color: var(--bg);}

/* Header / hero */
.hero{
  padding: 28px 20px 0;
  position: relative;
}
.eyebrow{
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ball);
  margin-bottom: 6px;
}
h1{
  font-family: 'Archivo Black', sans-serif;
  font-size: 28px;
  line-height: 1.08;
  letter-spacing: -0.01em;
}
h1 span{color: var(--ball);}
.sub{
  color: var(--muted);
  font-size: 13.5px;
  margin-top: 8px;
  max-width: 40ch;
}

/* Kitchen line divider — the signature element */
.kitchen-line{
  margin: 22px 0 18px;
  height: 10px;
  position: relative;
  display: flex;
  align-items: center;
}
.kitchen-line::before{
  content:"";
  position:absolute;
  left:0; right:0; top:50%;
  height:2px;
  background: repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 18px);
  opacity: 0.55;
  transform: translateY(-50%);
}

/* Tabs */
.tabs{
  display: flex;
  gap: 6px;
  padding: 0 20px;
  overflow-x: auto;
}
.tab{
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  padding: 9px 14px;
  border-radius: 100px;
  background: var(--surface);
  color: var(--muted);
  border: 1px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: all .15s ease;
}
.tab.active{
  background: var(--ball);
  color: var(--bg);
  font-weight: 600;
}
.tab:not(.active):hover{
  border-color: var(--muted);
  color: var(--text);
}

main{padding: 20px;}

/* Leaderboard */
.card{
  background: var(--surface);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 14px;
  border: 1px solid rgba(47,82,51,0.06);
}
.rank{
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  width: 22px;
  flex-shrink: 0;
}
.rank.gold{color: var(--ball);}
.player-info{flex: 1; min-width: 0;}
.player-name{font-weight: 700; font-size: 15.5px;}
.player-record{font-size: 12px; color: var(--muted); margin-top: 2px;}
.gender-tag{
  font-family:'DM Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 100px;
  margin-left: 6px;
  vertical-align: middle;
  font-weight: 600;
}
.tag-f{background: rgba(200,80,140,0.15); color: #A8386E;}
.tag-m{background: rgba(232,197,71,0.30); color: #8A6D0E;}
.rating-block{text-align: right; flex-shrink: 0;}
.rating-num{
  font-family: 'DM Mono', monospace;
  font-size: 24px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.rating-delta{
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  margin-top: 1px;
}
.delta-up{color: #2E7D4F;}
.delta-down{color: var(--coral);}
.btn-icon-remove{
  flex-shrink: 0;
  width: 30px; height: 30px;
  border-radius: 100px;
  border: 1px solid rgba(47,82,51,0.12);
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  line-height: 1;
}
.btn-icon-remove:hover{ border-color: var(--coral); color: var(--coral); }

.empty{
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}
.empty-title{font-family:'Archivo Black'; font-size: 18px; color: var(--text); margin-bottom: 8px;}

/* Forms */
.field{margin-bottom: 16px;}
.field label{
  display:block;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
}
input[type=text], input[type=number], select{
  width: 100%;
  background: var(--surface-2);
  border: 1px solid rgba(47,82,51,0.12);
  color: var(--text);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 15px;
  font-family: 'Inter', sans-serif;
}
input:focus, select:focus{
  outline: none;
  border-color: var(--ball);
}
.btn{
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.btn-primary{
  background: var(--ball);
  color: var(--bg);
}
.btn-primary:hover{filter: brightness(1.08);}
.btn-primary:disabled{opacity: 0.4; cursor: not-allowed;}
.btn-ghost{
  background: transparent;
  color: var(--muted);
  border: 1px solid rgba(47,82,51,0.15);
  margin-top: 8px;
}

.team-toggle{
  display:flex; gap:8px; margin-bottom:16px;
}
.team-toggle button{
  flex:1;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid rgba(47,82,51,0.12);
  background: var(--surface-2);
  color: var(--muted);
  font-family:'DM Mono', monospace;
  font-size: 12.5px;
  cursor: pointer;
}
.team-toggle button.active{
  background: var(--ball);
  color: var(--bg);
  border-color: var(--ball);
  font-weight:700;
}

.team-block{
  background: var(--surface);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.team-label{
  font-family:'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.team-a .team-label{color: var(--ball);}
.team-b .team-label{color: var(--coral);}
.score-row{display:flex; gap: 10px; align-items:center; margin-top: 10px;}
.score-row input{text-align:center; font-size: 20px; font-family:'DM Mono', monospace;}
.vs{
  font-family:'Archivo Black';
  color: var(--muted);
  font-size: 13px;
}

/* Next games */
.checkbox-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid rgba(47,82,51,0.06);
  cursor:pointer;
}
.checkbox-row:last-child{border-bottom:none;}
.checkbox-row input[type=checkbox]{
  width:19px; height:19px; accent-color: var(--ball); flex-shrink:0;
}
.checklist-card{
  background: var(--surface);
  border-radius: 14px;
  padding: 4px 16px;
  margin-bottom: 4px;
  border: 1px solid rgba(47,82,51,0.06);
}
.small-btn{width:auto; padding:9px 16px; font-size:12.5px; margin-top:12px;}
.court-card{
  background: var(--surface);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1px solid rgba(47,82,51,0.06);
}
.court-title{
  display:flex; justify-content:space-between; align-items:center;
  font-family:'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.court-title .quality{color: var(--ball);}
.court-match{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.court-side{flex:1; font-size: 14.5px; line-height:1.4;}
.court-vs{font-family:'Archivo Black'; color: var(--muted); font-size: 12px; flex-shrink:0;}
.sitting-out{
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
  padding: 12px 4px;
}

/* Live scoring */
.scoreboard{display:flex; align-items:stretch; gap:10px; margin-bottom:14px;}
.score-side{
  flex:1;
  background: var(--surface);
  border-radius: 16px;
  padding: 18px 10px;
  text-align: center;
  border: 1px solid rgba(47,82,51,0.06);
  display: flex;
  flex-direction: column;
}
.score-name{
  font-weight: 700;
  font-size: 13px;
  min-height: 34px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap: 5px;
}
.serve-dot{
  display:inline-block;
  width: 8px; height: 8px;
  border-radius: 100px;
  background: var(--ball);
  flex-shrink:0;
}
.score-value{
  font-family:'DM Mono', monospace;
  font-size: 56px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  margin: 10px 0 16px;
  line-height: 1;
}
.serve-slot-note{
  min-height: 14px;
  margin-top: 4px;
}
.ball-icon-row{
  display: flex;
  justify-content: center;
  gap: 4px;
}
.ball-icon{
  width: 9px; height: 9px;
  border-radius: 100px;
  background: var(--ball);
  display: inline-block;
}
.score-tap-btn{
  width: 100%;
  margin-top: auto;
  padding: 16px;
  border-radius: 12px;
  border: none;
  background: var(--ball);
  color: var(--bg);
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
}
.score-tap-btn:disabled{ opacity: 0.35; cursor: not-allowed; }
.live-winner-banner{
  text-align: center;
  font-family: 'Archivo Black';
  font-size: 16px;
  color: var(--ball);
  padding: 14px 0 4px;
}

/* Live-now banner on the Leaderboard (viewer card) */
.live-now-banner{
  background: linear-gradient(135deg, var(--surface), var(--surface-2));
  border: 1px solid rgba(196,63,38,0.28);
  border-radius: 18px;
  padding: 16px 16px 18px;
  margin-bottom: 18px;
}
.live-now-header{
  display: flex;
  align-items: center;
  gap: 8px;
}
.live-pulse-dot{
  width: 8px; height: 8px;
  border-radius: 100px;
  background: var(--coral);
  flex-shrink: 0;
  animation: livePulse 1.4s ease-in-out infinite;
}
@keyframes livePulse{
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.75); }
}
.live-now-label{
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--coral);
  font-weight: 700;
}
.live-now-meta{
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  color: var(--muted);
  margin-left: auto;
}
.live-now-clickable{
  cursor: pointer;
  transition: transform 0.1s ease;
}
.live-now-clickable:active{
  transform: scale(0.985);
}
.live-now-manage{
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ball);
  font-weight: 700;
  margin-top: 12px;
}

/* History */
.match-card{
  background: var(--surface);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  border: 1px solid rgba(47,82,51,0.06);
}
.match-date{
  font-family:'DM Mono', monospace;
  font-size: 10.5px;
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}
.match-teams{display:flex; align-items:center; justify-content:space-between; gap: 10px;}
.match-side{flex:1; font-size: 14px;}
.match-side.winner{font-weight: 700; color: var(--ball);}
.match-score{
  font-family:'DM Mono', monospace;
  font-size: 18px;
  font-weight:500;
  padding: 0 10px;
}

.section-title{
  font-family:'Archivo Black';
  font-size: 15px;
  margin-bottom: 14px;
  color: var(--muted);
}

.toast{
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ball);
  color: var(--bg);
  padding: 12px 20px;
  border-radius: 100px;
  font-weight: 700;
  font-size: 13.5px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  animation: rise 0.2s ease;
  z-index: 100;
}
@keyframes rise{ from{opacity:0; transform: translate(-50%, 10px);} to{opacity:1; transform: translate(-50%,0);} }

.shared-note{
  font-size: 11px;
  color: var(--muted);
  text-align:center;
  margin-top: 18px;
  font-family: 'DM Mono', monospace;
}
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">Rating tracker</div>
  <h1>Humba Pickleball League</h1>
  <p class="sub">Track matches, watch ratings move. Synced live for the whole crew.</p>
</div>
<div class="kitchen-line"></div>

<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div id="toastHost"></div>

<script>
const STORAGE_KEY = 'pickleball-app-data';
const START_RATING = 3.5;
const K = 0.09;
const POINT_SHARE_SCALE = 2.0; // gap-to-expected-point-share steepness
const RELIABILITY_MATCHES = 20; // matches to reach 100% reliability, per format

let state = {
  players: [],   // {id, name, gender, rating, wins, losses, lastDelta}
  matches: [],   // {id, date, type, teamA:[ids], teamB:[ids], scoreA, scoreB, deltaA, deltaB}
  loaded: false
};
let view = 'leaderboard';
let leaderboardMode = 'doubles'; // 'doubles' | 'singles' — DUPR tracks these separately
let matchTeamSize = 'mixed'; // 'singles' | 'doubles' | 'mixed'
let newPlayerGender = 'F';
let matchPrefill = null; // {type:'mixed', teamA:{M,F}, teamB:{M,F}} or {type:'singles', teamA:[id], teamB:[id]} — pre-fill from generator
let editingMatchId = null; // id of match currently being score-edited in History tab
let pendingCourtSource = null; // {roundIndex, courtIndex} of a Next-games court being logged/played — removed from the schedule once actually logged; cleared if abandoned

// Live scoring state (in-memory only — resets on reload)
// serverPlayerIndex: which player (0 or 1) within the serving team is serving.
// serverSlot: 1 or 2 — tracks doubles' two-server rule. Starts at 2 because
// official pickleball rules treat the very first serve of the game as if it
// were already the team's second server, so a single loss side-outs immediately.
let live = { started: false, type: 'mixed', target: 11, teamA: [], teamB: [], scoreA: 0, scoreB: 0, history: [], serving: 'A', serverPlayerIndex: 0, serverSlot: 2 };
function resetLive(){
  live = { started: false, type: live.type, target: live.target, teamA: [], teamB: [], scoreA: 0, scoreB: 0, history: [], serving: 'A', serverPlayerIndex: 0, serverSlot: 2 };
}

// Formats a team's player names for display, prefixing a serve-dot next to
// whichever player is currently serving (only meaningful for the serving team).
function formatSideNames(teamIds){
  return teamIds.map(id => escapeHtml(playerById(id)?.name || '—')).join(' &amp; ');
}

// One ball icon for the 1st server, two for the 2nd server.
function renderBallIcons(serverSlot){
  const count = serverSlot === 2 ? 2 : 1;
  return `<div class="ball-icon-row">${'<span class="ball-icon"></span>'.repeat(count)}</div>`;
}

// Admin flag — gated by a shared password, stored locally once entered
// correctly. Whoever enables it on their device stays admin until they turn it off.
const ADMIN_STORAGE_KEY = 'humba-admin';
const ADMIN_PASSWORD = 'humba';
let isAdmin = false;
try{ isAdmin = localStorage.getItem(ADMIN_STORAGE_KEY) === 'true'; }catch(e){ isAdmin = false; }
function setAdmin(flag){
  isAdmin = flag;
  try{ localStorage.setItem(ADMIN_STORAGE_KEY, flag ? 'true' : 'false'); }catch(e){}
}

// Live-match viewer state — non-admin devices poll this while on the
// Leaderboard tab so they can watch the score without controlling it.
let liveViewerData = null;
let liveViewerFetchedAt = null;
let liveViewerPoll = null;

function rowToLiveMatch(r){
  return { type: r.type, teamA: r.team_a, teamB: r.team_b, scoreA: r.score_a, scoreB: r.score_b, target: r.target, serving: r.serving, serverPlayerId: r.server_player_id, serverSlot: r.server_slot };
}

async function fetchLiveViewerData(){
  try{
    const rows = await supaSelect('live_matches');
    liveViewerData = (rows && rows.length) ? rowToLiveMatch(rows[0]) : null;
  }catch(e){
    liveViewerData = null;
  }
  liveViewerFetchedAt = Date.now();
  if(view === 'leaderboard') render();
}

function startLiveViewerPolling(){
  if(liveViewerPoll) return;
  fetchLiveViewerData();
  liveViewerPoll = setInterval(fetchLiveViewerData, 5000);
}
function stopLiveViewerPolling(){
  if(liveViewerPoll){ clearInterval(liveViewerPoll); liveViewerPoll = null; }
}

// Pushes the admin's in-progress live match to Supabase so viewers can see
// it; best-effort — a missed sync just means the viewer card is a beat stale.
function syncLiveMatch(){
  if(!live.started) return;
  const servingTeamArr = live.serving === 'A' ? live.teamA : live.teamB;
  const serverPlayerId = servingTeamArr[live.serverPlayerIndex] ?? servingTeamArr[0] ?? null;
  supaUpsert('live_matches', [{
    id: 'current', type: live.type, team_a: live.teamA, team_b: live.teamB,
    score_a: live.scoreA, score_b: live.scoreB, target: live.target, serving: live.serving,
    server_player_id: serverPlayerId, server_slot: live.serverSlot
  }]).catch(() => {});
}
function clearLiveMatchRemote(){
  supaDelete('live_matches', 'current').catch(() => {});
}

// Lets admin resume control of a live match that's already running remotely
// but isn't loaded in this tab's local state (e.g. after a page reload).
function resumeLiveFromRemote(lv){
  const servingArr = lv.serving === 'A' ? lv.teamA : lv.teamB;
  const idx = servingArr.indexOf(lv.serverPlayerId);
  live.type = lv.type;
  live.teamA = lv.teamA;
  live.teamB = lv.teamB;
  live.scoreA = lv.scoreA;
  live.scoreB = lv.scoreB;
  live.target = lv.target;
  live.serving = lv.serving;
  live.serverPlayerIndex = idx >= 0 ? idx : 0;
  live.serverSlot = lv.serverSlot || 1;
  live.history = []; // undo history isn't synced remotely, so it can't be restored
  live.started = true;
}

// Jumps straight into live scoring for a court proposed by the Next Games
// generator — skips the setup screen since the players are already picked.
function startLiveFromCourt(round, court){
  const teamA = round.mode === 'singles' ? court.teamA : [court.teamA.M, court.teamA.F];
  const teamB = round.mode === 'singles' ? court.teamB : [court.teamB.M, court.teamB.F];
  live.type = round.mode === 'singles' ? 'singles' : 'mixed';
  live.teamA = teamA;
  live.teamB = teamB;
  live.scoreA = 0;
  live.scoreB = 0;
  live.history = [];
  live.serving = 'A';
  live.serverPlayerIndex = 0;
  live.serverSlot = 2;
  live.started = true;
  view = 'liveScore';
  render();
  syncLiveMatch();
}

// Next-games generator state (in-memory only, resets on reload — scoped to "today")
let sessionPresentIds = new Set();
let sessionGenMode = 'mixed';  // 'mixed' | 'singles'
let sessionCourts = null;
let sessionGameCount = null;   // how many rounds/games to generate in one batch
let sessionAppearances = {};   // playerId -> games played today (seeded from real match history, then topped up per proposed round)
let sessionRoundsHistory = []; // array of generated rounds (for repeat-avoidance)
let currentSchedule = null;    // array of generated rounds: [{courts, sittingOut}, ...]
let selA = [null, null];
let selB = [null, null];

const $ = sel => document.querySelector(sel);
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

/* ---------- Supabase storage layer ---------- */
const SUPABASE_URL = 'https://fsarmuqurnkuvxrxigck.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jmGoK-iv7zgV9U_nTy6IcA_KRNCRyrp';

async function supaFetch(path, options = {}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...(options.headers || {})
    }
  });
  if(!res.ok){
    const text = await res.text().catch(() => '');
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  return res.status === 204 ? null : res.json();
}

const supaSelect = table => supaFetch(`${table}?select=*`);

const supaUpsert = (table, rows) => {
  if(!rows.length) return Promise.resolve([]);
  return supaFetch(`${table}?on_conflict=id`, {
    method: 'POST',
    body: JSON.stringify(rows),
    headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' }
  });
};

const supaDelete = (table, id) =>
  supaFetch(`${table}?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });

function playerToRow(p){
  return {
    id: p.id, name: p.name, gender: p.gender,
    rating_doubles: p.ratingDoubles, rating_singles: p.ratingSingles,
    matches_doubles: p.matchesDoubles, matches_singles: p.matchesSingles,
    wins: p.wins, losses: p.losses,
    last_delta: p.lastDelta, last_delta_format: p.lastDeltaFormat
  };
}
function rowToPlayer(r){
  return {
    id: r.id, name: r.name, gender: r.gender,
    ratingDoubles: Number(r.rating_doubles), ratingSingles: Number(r.rating_singles),
    matchesDoubles: r.matches_doubles, matchesSingles: r.matches_singles,
    wins: r.wins, losses: r.losses,
    lastDelta: r.last_delta != null ? Number(r.last_delta) : null,
    lastDeltaFormat: r.last_delta_format
  };
}
function matchToRow(m){
  return {
    id: m.id, date: m.date, type: m.type,
    team_a: m.teamA, team_b: m.teamB,
    score_a: m.scoreA, score_b: m.scoreB,
    delta_a: m.deltaA ?? null, delta_b: m.deltaB ?? null,
    ratable: m.ratable !== false
  };
}
function rowToMatch(r){
  return {
    id: r.id, date: Number(r.date), type: r.type,
    teamA: r.team_a, teamB: r.team_b,
    scoreA: r.score_a, scoreB: r.score_b,
    deltaA: r.delta_a != null ? Number(r.delta_a) : undefined,
    deltaB: r.delta_b != null ? Number(r.delta_b) : undefined,
    ratable: r.ratable
  };
}

async function loadData(){
  try{
    const [playerRows, matchRows] = await Promise.all([supaSelect('players'), supaSelect('matches')]);
    state.players = (playerRows || []).map(rowToPlayer);
    state.matches = (matchRows || []).map(rowToMatch);
  }catch(e){
    showToast("Couldn't connect to the database");
  }
  state.players.forEach(p => sessionPresentIds.add(p.id));
  recomputeRatings(); // rebuild ratings from match history — self-healing, handles schema changes
  state.loaded = true;
  render();
}

async function saveData(){
  try{
    await supaUpsert('players', state.players.map(playerToRow));
    await supaUpsert('matches', state.matches.map(matchToRow));
  }catch(e){
    showToast("Couldn't save — try again");
  }
}

function exportData(){
  const blob = new Blob([JSON.stringify({ players: state.players, matches: state.matches }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `humba-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

async function importData(file){
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!Array.isArray(parsed.players) || !Array.isArray(parsed.matches)){
      showToast('That file doesn\'t look right');
      return;
    }
    state.players = parsed.players;
    state.matches = parsed.matches;
    recomputeRatings();
    await saveData();
    showToast('Data imported');
    render();
  }catch(e){
    showToast('Could not read that file');
  }
}

function showToast(msg){
  const host = $('#toastHost');
  host.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2200);
}

function playerById(id){ return state.players.find(p => p.id === id); }

function eloExpected(rA, rB){
  // Scaled down from raw win-probability: this represents expected SHARE of
  // total points, not win chance, so it needs a gentler curve or a 1.0 rating
  // gap would imply an almost-certain-blowout expected share.
  return 1 / (1 + Math.pow(10, (rB - rA) / POINT_SHARE_SCALE));
}

/* DUPR's published mechanics (dupr.com/how-it-works):
   - Rating moves based on performance vs. the expected score for the match,
     not just win/loss — you can lose rating in a win, or gain it in a loss.
   - Matches where the two team ratings differ by more than 1.0 don't affect
     rating at all (the outcome isn't informative when one side is heavily favored).
   - Singles and doubles (mixed included) are tracked as separate ratings. */
function isRatable(teamARating, teamBRating){
  return Math.abs(teamARating - teamBRating) <= 1.0;
}

function computeDelta(teamARating, teamBRating, scoreA, scoreB){
  const expectedA = eloExpected(teamARating, teamBRating);
  const pointShareA = scoreA / (scoreA + scoreB); // performance, not just win/loss
  return K * (pointShareA - expectedA);
}

function ratingField(matchType){ return matchType === 'singles' ? 'ratingSingles' : 'ratingDoubles'; }
function matchesField(matchType){ return matchType === 'singles' ? 'matchesSingles' : 'matchesDoubles'; }

/* Replays full match history in date order to rebuild every player's ratings,
   wins, losses, and reliability from scratch. Used after logging, editing, or
   removing a player/match so ratings stay consistent with the true history. */
function recomputeRatings(){
  state.players.forEach(p => {
    p.ratingDoubles = START_RATING;
    p.ratingSingles = START_RATING;
    p.matchesDoubles = 0;
    p.matchesSingles = 0;
    p.wins = 0;
    p.losses = 0;
    p.winsDoubles = 0;
    p.lossesDoubles = 0;
    p.winsSingles = 0;
    p.lossesSingles = 0;
    p.lastDelta = null;
    p.lastDeltaFormat = null;
  });
  const sorted = [...state.matches].sort((a, b) => a.date - b.date);
  sorted.forEach(m => {
    const teamAPlayers = m.teamA.map(playerById).filter(Boolean);
    const teamBPlayers = m.teamB.map(playerById).filter(Boolean);
    if(teamAPlayers.length === 0 || teamBPlayers.length === 0) return; // both partners removed on a side — skip

    const field = ratingField(m.type);
    const mField = matchesField(m.type);
    const winsField = mField === 'matchesDoubles' ? 'winsDoubles' : 'winsSingles';
    const lossesField = mField === 'matchesDoubles' ? 'lossesDoubles' : 'lossesSingles';
    const ratingA = teamAPlayers.reduce((s, p) => s + p[field], 0) / teamAPlayers.length;
    const ratingB = teamBPlayers.reduce((s, p) => s + p[field], 0) / teamBPlayers.length;
    const ratable = isRatable(ratingA, ratingB);
    const delta = ratable ? computeDelta(ratingA, ratingB, m.scoreA, m.scoreB) : 0;

    teamAPlayers.forEach(p => {
      if(ratable){ p[field] = clamp(p[field] + delta, 2.0, 8.0); p.lastDelta = delta; p.lastDeltaFormat = field; }
      p[mField]++;
      if(m.scoreA > m.scoreB){ p.wins++; p[winsField]++; } else { p.losses++; p[lossesField]++; }
    });
    teamBPlayers.forEach(p => {
      if(ratable){ p[field] = clamp(p[field] - delta, 2.0, 8.0); p.lastDelta = -delta; p.lastDeltaFormat = field; }
      p[mField]++;
      if(m.scoreB > m.scoreA){ p.wins++; p[winsField]++; } else { p.losses++; p[lossesField]++; }
    });
    m.deltaA = delta;
    m.deltaB = -delta;
    m.ratable = ratable;
  });
}

async function removePlayer(id){
  const p = playerById(id);
  if(!p) return;
  if(!confirm(`Remove ${p.name}? Their past matches stay in history, but they'll drop off the roster.`)) return;
  state.players = state.players.filter(pl => pl.id !== id);
  sessionPresentIds.delete(id);
  delete sessionAppearances[id];
  recomputeRatings();
  try{
    await supaDelete('players', id);
  }catch(e){
    showToast("Couldn't reach the database — try again");
    return;
  }
  await saveData();
  showToast(`${p.name} removed`);
  render();
}

async function deleteMatch(id){
  const m = state.matches.find(mm => mm.id === id);
  if(!m) return;
  if(!confirm('Delete this match? Ratings will be recalculated without it.')) return;
  state.matches = state.matches.filter(mm => mm.id !== id);
  recomputeRatings();
  try{
    await supaDelete('matches', id);
  }catch(e){
    showToast("Couldn't reach the database — try again");
    return;
  }
  await saveData();
  showToast('Match deleted');
  render();
}

/* ---------- Next games generator ---------- */
function pairKey(a, b){ return [a, b].sort().join('|'); }

function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Ground truth for "games played today" — read from actually-logged matches,
// not from in-memory proposals. This survives regenerate/reset and correctly
// reflects games that were played from an earlier batch this session.
function isToday(ts){
  const d = new Date(ts), now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}
function getTodaysAppearanceCounts(){
  const counts = {};
  state.matches.forEach(m => {
    if(!isToday(m.date)) return;
    [...m.teamA, ...m.teamB].forEach(id => { counts[id] = (counts[id] || 0) + 1; });
  });
  return counts;
}

// Removes a court from the currently displayed Next-games schedule once it's
// actually been logged (or played live), so it stops showing as "to play".
function removePendingScheduleCourt(){
  const source = pendingCourtSource;
  pendingCourtSource = null;
  if(!source || !currentSchedule) return;
  const round = currentSchedule[source.roundIndex];
  if(!round) return;
  round.courts.splice(source.courtIndex, 1);
  if(round.courts.length === 0) currentSchedule.splice(source.roundIndex, 1);
  if(currentSchedule.length === 0) currentSchedule = null;
}

function buildHistoryCounts(){
  const partner = {}, opponent = {};
  const addPartner = (a, b) => { const k = pairKey(a, b); partner[k] = (partner[k] || 0) + 1; };
  const addOpponent = (a, b) => { const k = pairKey(a, b); opponent[k] = (opponent[k] || 0) + 1; };
  state.matches.forEach(m => {
    if(m.teamA.length === 2) addPartner(m.teamA[0], m.teamA[1]);
    if(m.teamB.length === 2) addPartner(m.teamB[0], m.teamB[1]);
    m.teamA.forEach(a => m.teamB.forEach(b => addOpponent(a, b)));
  });
  sessionRoundsHistory.forEach(r => {
    r.courts.forEach(c => {
      if(r.mode === 'singles'){
        addOpponent(c.teamA[0], c.teamB[0]);
      } else {
        addPartner(c.teamA.M, c.teamA.F);
        addPartner(c.teamB.M, c.teamB.F);
        [c.teamA.M, c.teamA.F].forEach(a => [c.teamB.M, c.teamB.F].forEach(b => addOpponent(a, b)));
      }
    });
  });
  return { partner, opponent };
}

function buildOneRound(){
  return sessionGenMode === 'singles' ? buildOneSinglesRound() : buildOneMixedRound();
}

function buildOneMixedRound(){
  const presentPlayers = state.players.filter(p => sessionPresentIds.has(p.id));
  const men = presentPlayers.filter(p => p.gender === 'M');
  const women = presentPlayers.filter(p => p.gender === 'F');
  const maxCourtsByGender = Math.min(Math.floor(men.length / 2), Math.floor(women.length / 2));
  const courts = Math.max(0, Math.min(sessionCourts || 1, maxCourtsByGender));
  if(courts < 1) return null;

  const neededEach = courts * 2;
  const sortByAppearance = arr => [...arr].sort((a, b) =>
    (sessionAppearances[a.id] || 0) - (sessionAppearances[b.id] || 0) ||
    (a.matchesDoubles || 0) - (b.matchesDoubles || 0) ||
    Math.random() - 0.5
  );
  const playingMen = sortByAppearance(men).slice(0, neededEach);
  const playingWomen = sortByAppearance(women).slice(0, neededEach);
  const playingIds = new Set([...playingMen, ...playingWomen].map(p => p.id));
  const benched = presentPlayers.filter(p => !playingIds.has(p.id));

  const { partner, opponent } = buildHistoryCounts();

  function scoreAssignment(courtsArr){
    let score = 0;
    courtsArr.forEach(c => {
      score += (partner[pairKey(c.teamA.M, c.teamA.F)] || 0) * 6;
      score += (partner[pairKey(c.teamB.M, c.teamB.F)] || 0) * 6;
      [c.teamA.M, c.teamA.F].forEach(a => [c.teamB.M, c.teamB.F].forEach(b => {
        score += (opponent[pairKey(a, b)] || 0) * 2;
      }));
      const rA = (playerById(c.teamA.M).ratingDoubles + playerById(c.teamA.F).ratingDoubles) / 2;
      const rB = (playerById(c.teamB.M).ratingDoubles + playerById(c.teamB.F).ratingDoubles) / 2;
      score += Math.pow(rA - rB, 2) * 4;
    });
    return score;
  }

  let best = null, bestScore = Infinity;
  for(let iter = 0; iter < 250; iter++){
    const m = shuffle(playingMen), w = shuffle(playingWomen);
    const candidate = [];
    for(let c = 0; c < courts; c++){
      const m1 = m[c*2], m2 = m[c*2+1], w1 = w[c*2], w2 = w[c*2+1];
      if(Math.random() < 0.5){
        candidate.push({ teamA: { M: m1.id, F: w1.id }, teamB: { M: m2.id, F: w2.id } });
      } else {
        candidate.push({ teamA: { M: m1.id, F: w2.id }, teamB: { M: m2.id, F: w1.id } });
      }
    }
    const s = scoreAssignment(candidate);
    if(s < bestScore){ bestScore = s; best = candidate; }
  }

  best.forEach(c => {
    [c.teamA.M, c.teamA.F, c.teamB.M, c.teamB.F].forEach(id => {
      sessionAppearances[id] = (sessionAppearances[id] || 0) + 1;
    });
    const rA = (playerById(c.teamA.M).ratingDoubles + playerById(c.teamA.F).ratingDoubles) / 2;
    const rB = (playerById(c.teamB.M).ratingDoubles + playerById(c.teamB.F).ratingDoubles) / 2;
    c.ratingDiff = Math.abs(rA - rB);
  });

  const round = { mode: 'mixed', courts: best, sittingOut: benched.map(p => p.id) };
  sessionRoundsHistory.push(round); // feeds repeat-avoidance for the next round in this batch
  return round;
}

function buildOneSinglesRound(){
  const presentPlayers = state.players.filter(p => sessionPresentIds.has(p.id));
  const maxCourtsByCount = Math.floor(presentPlayers.length / 2);
  const courts = Math.max(0, Math.min(sessionCourts || 1, maxCourtsByCount));
  if(courts < 1) return null;

  const neededEach = courts * 2;
  const sortByAppearance = arr => [...arr].sort((a, b) =>
    (sessionAppearances[a.id] || 0) - (sessionAppearances[b.id] || 0) ||
    (a.matchesSingles || 0) - (b.matchesSingles || 0) ||
    Math.random() - 0.5
  );
  const playing = sortByAppearance(presentPlayers).slice(0, neededEach);
  const playingIds = new Set(playing.map(p => p.id));
  const benched = presentPlayers.filter(p => !playingIds.has(p.id));

  const { opponent } = buildHistoryCounts();

  function scoreAssignment(courtsArr){
    let score = 0;
    courtsArr.forEach(c => {
      score += (opponent[pairKey(c.teamA[0], c.teamB[0])] || 0) * 4;
      const rA = playerById(c.teamA[0]).ratingSingles;
      const rB = playerById(c.teamB[0]).ratingSingles;
      score += Math.pow(rA - rB, 2) * 4;
    });
    return score;
  }

  let best = null, bestScore = Infinity;
  for(let iter = 0; iter < 250; iter++){
    const p = shuffle(playing);
    const candidate = [];
    for(let c = 0; c < courts; c++){
      candidate.push({ teamA: [p[c*2].id], teamB: [p[c*2+1].id] });
    }
    const s = scoreAssignment(candidate);
    if(s < bestScore){ bestScore = s; best = candidate; }
  }

  best.forEach(c => {
    [c.teamA[0], c.teamB[0]].forEach(id => {
      sessionAppearances[id] = (sessionAppearances[id] || 0) + 1;
    });
    const rA = playerById(c.teamA[0]).ratingSingles;
    const rB = playerById(c.teamB[0]).ratingSingles;
    c.ratingDiff = Math.abs(rA - rB);
  });

  const round = { mode: 'singles', courts: best, sittingOut: benched.map(p => p.id) };
  sessionRoundsHistory.push(round);
  return round;
}

function generateSchedule(){
  const presentPlayers = state.players.filter(p => sessionPresentIds.has(p.id));
  if(sessionGenMode === 'singles'){
    if(presentPlayers.length < 2){
      showToast('Need at least 2 players checked in');
      return;
    }
  } else {
    const men = presentPlayers.filter(p => p.gender === 'M');
    const women = presentPlayers.filter(p => p.gender === 'F');
    if(Math.min(men.length, women.length) < 2){
      showToast('Need at least 2 men and 2 ladies checked in');
      return;
    }
  }
  // Reseed from actually-logged games today, discarding any unplayed
  // proposals from a previous batch — so games already played (even from
  // an earlier generate) are never forgotten or double-counted.
  sessionRoundsHistory = [];
  sessionAppearances = getTodaysAppearanceCounts();
  const count = Math.max(1, sessionGameCount || 1);
  const schedule = [];
  for(let i = 0; i < count; i++){
    const round = buildOneRound();
    if(!round) break;
    schedule.push(round);
  }
  if(schedule.length === 0){
    showToast(sessionGenMode === 'singles' ? 'Need at least 2 players checked in' : 'Need at least 2 men and 2 ladies checked in');
    return;
  }
  currentSchedule = schedule;
  render();
}

function renderNextGames(){
  if(state.players.length === 0){
    return emptyState('No players yet', 'Add players first, then generate matchups.', 'players');
  }
  const presentAll = state.players.filter(p => sessionPresentIds.has(p.id));
  const men = presentAll.filter(p => p.gender === 'M');
  const women = presentAll.filter(p => p.gender === 'F');
  const maxCourts = sessionGenMode === 'singles'
    ? Math.max(1, Math.floor(presentAll.length / 2) || 1)
    : Math.max(1, Math.min(Math.floor(men.length / 2), Math.floor(women.length / 2)) || 1);
  if(sessionCourts === null) sessionCourts = maxCourts;
  if(sessionGameCount === null) sessionGameCount = sessionCourts <= 1 ? 8 : 3;

  const checklist = state.players.map(p => `
    <label class="checkbox-row">
      <input type="checkbox" data-presence="${p.id}" ${sessionPresentIds.has(p.id) ? 'checked' : ''}>
      <span>${escapeHtml(p.name)} <span class="gender-tag ${p.gender==='F'?'tag-f':'tag-m'}">${p.gender==='F'?'Ladies':'Men'}</span></span>
    </label>
  `).join('');

  const qualityLabel = d => d < 0.15 ? 'Even match' : d < 0.4 ? 'Close' : 'Uneven';

  const scheduleHtml = currentSchedule ? currentSchedule.map((round, ri) => `
    <div class="section-title">${sessionCourts <= 1 ? `Game ${ri+1}` : `Round ${ri+1}`}</div>
    ${round.courts.map((c, ci) => `
      <div class="court-card">
        <div class="court-title"><span>${sessionCourts <= 1 ? 'Court' : `Court ${ci+1}`}</span><span class="quality">${qualityLabel(c.ratingDiff)}</span></div>
        <div class="court-match">
          ${round.mode === 'singles' ? `
            <div class="court-side">${escapeHtml(playerById(c.teamA[0])?.name || '—')}</div>
            <div class="court-vs">VS</div>
            <div class="court-side" style="text-align:right">${escapeHtml(playerById(c.teamB[0])?.name || '—')}</div>
          ` : `
            <div class="court-side">${escapeHtml(playerById(c.teamA.M)?.name || '—')} &amp; ${escapeHtml(playerById(c.teamA.F)?.name || '—')}</div>
            <div class="court-vs">VS</div>
            <div class="court-side" style="text-align:right">${escapeHtml(playerById(c.teamB.M)?.name || '—')} &amp; ${escapeHtml(playerById(c.teamB.F)?.name || '—')}</div>
          `}
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn btn-ghost small-btn" style="margin-top:0;" data-log-round="${ri}" data-log-court="${ci}">Log score</button>
          ${isAdmin ? `<button class="btn btn-ghost small-btn" style="margin-top:0;" data-start-live-round="${ri}" data-start-live-court="${ci}">Start live scoring</button>` : ''}
        </div>
      </div>
    `).join('')}
    ${round.sittingOut.length ? `<div class="sitting-out">Sitting out: ${round.sittingOut.map(id => escapeHtml(playerById(id)?.name || '')).join(', ')}</div>` : ''}
  `).join('') : '';

  return `
    <div class="team-toggle" id="genModeToggle">
      <button data-mode="mixed" class="${sessionGenMode==='mixed'?'active':''}">Mixed doubles</button>
      <button data-mode="singles" class="${sessionGenMode==='singles'?'active':''}">Singles</button>
    </div>
    <div class="section-title">Who's here today?</div>
    <div class="checklist-card">${checklist}</div>
    <div class="field" style="margin-top:16px">
      <label>Courts available</label>
      <input type="number" id="courtsInput" min="1" max="${maxCourts}" value="${sessionCourts}">
    </div>
    <div class="field">
      <label>Games to generate</label>
      <input type="number" id="gameCountInput" min="1" max="30" value="${sessionGameCount}">
    </div>
    <button class="btn btn-primary" id="generateBtn">${currentSchedule ? 'Regenerate matchups' : 'Generate matchups'}</button>
    ${currentSchedule ? `<button class="btn btn-ghost" id="resetRotationBtn">Reset rotation</button>` : ''}
    <div style="height:22px"></div>
    ${scheduleHtml}
  `;
}

/* ---------- Live scoring ---------- */
function computeLiveWinner(){
  const { scoreA, scoreB, target } = live;
  if(scoreA >= target && scoreA - scoreB >= 2) return 'A';
  if(scoreB >= target && scoreB - scoreA >= 2) return 'B';
  return null;
}

// Only the serving side can score a point; if the other side wins the rally,
// no point is awarded and serve just passes to them (a side-out) — standard
// pickleball team-level scoring, simplified to not track per-player server order.
// Only the serving side can score. In doubles/mixed, each team gets two
// server turns per possession (one per player) before a side-out — except
// the very first serve of the game, which only gets one (serverSlot starts
// at 2 to encode that). Singles has no partner to hand off to, so any loss
// is an immediate side-out regardless of serverSlot.
function recordRally(winner){
  if(computeLiveWinner()) return;
  live.history.push({
    scoreA: live.scoreA, scoreB: live.scoreB,
    serving: live.serving, serverPlayerIndex: live.serverPlayerIndex, serverSlot: live.serverSlot
  });
  if(winner === live.serving){
    if(winner === 'A') live.scoreA++; else live.scoreB++;
    // same server continues
  } else {
    const servingTeamSize = (live.serving === 'A' ? live.teamA : live.teamB).length;
    if(servingTeamSize > 1 && live.serverSlot === 1){
      // first server of a doubles team loses — partner serves next, team keeps serve
      live.serverSlot = 2;
      live.serverPlayerIndex = 1 - live.serverPlayerIndex;
    } else {
      // second server loses (or singles) — side-out
      live.serving = winner;
      live.serverPlayerIndex = 0;
      live.serverSlot = 1;
    }
  }
  render();
  syncLiveMatch();
}

function undoRally(){
  const prev = live.history.pop();
  if(!prev) return;
  live.scoreA = prev.scoreA;
  live.scoreB = prev.scoreB;
  live.serving = prev.serving;
  live.serverPlayerIndex = prev.serverPlayerIndex;
  live.serverSlot = prev.serverSlot;
  render();
  syncLiveMatch();
}

async function finishLiveMatch(){
  state.matches.push({
    id: uid(), date: Date.now(), type: live.type,
    teamA: live.teamA, teamB: live.teamB,
    scoreA: live.scoreA, scoreB: live.scoreB
  });
  recomputeRatings();
  removePendingScheduleCourt();
  clearLiveMatchRemote();
  await saveData();
  showToast('Match logged');
  resetLive();
  view = 'leaderboard';
  render();
}

function renderLiveScore(){
  return live.started ? renderLiveBoard() : renderLiveSetup();
}

function renderLiveSetup(){
  if(state.players.length < 2){
    return emptyState('Need more players', 'Add at least two players before starting a live match.', 'players');
  }
  const men = state.players.filter(p => p.gender === 'M');
  const women = state.players.filter(p => p.gender === 'F');
  const optAll = state.players.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  const optMen = men.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  const optWomen = women.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');

  const typeToggle = `
    <div class="team-toggle" id="liveTypeToggle">
      <button data-livetype="singles" class="${live.type==='singles'?'active':''}">Singles</button>
      <button data-livetype="doubles" class="${live.type==='doubles'?'active':''}">Doubles</button>
      <button data-livetype="mixed" class="${live.type==='mixed'?'active':''}">Mixed</button>
    </div>
  `;

  if(live.type === 'mixed' && (men.length < 2 || women.length < 2)){
    return `
      <div class="section-title">Start a live match</div>
      ${typeToggle}
      ${emptyState('Need more players', 'Mixed doubles needs at least 2 men and 2 ladies. Add more players first.', 'players')}
    `;
  }

  let slots;
  if(live.type === 'singles'){
    slots = { a: [{label: null, options: optAll}], b: [{label: null, options: optAll}] };
  } else if(live.type === 'mixed'){
    slots = {
      a: [{label: 'Men', options: optMen}, {label: 'Ladies', options: optWomen}],
      b: [{label: 'Men', options: optMen}, {label: 'Ladies', options: optWomen}]
    };
  } else {
    slots = { a: [{label: null, options: optAll}, {label: null, options: optAll}], b: [{label: null, options: optAll}, {label: null, options: optAll}] };
  }

  const renderSlot = (team, i, slot) => `
    <div class="field" style="margin-bottom:${i===slots[team.toLowerCase()].length-1?'0':'10px'}">
      ${slot.label ? `<label style="margin-bottom:5px">${slot.label}</label>` : ''}
      <select data-liveteam="${team}" data-liveslot="${i}">
        <option value="">Select player…</option>
        ${slot.options}
      </select>
    </div>
  `;

  return `
    <div class="section-title">Start a live match</div>
    ${typeToggle}
    <div class="team-block team-a">
      <div class="team-label">Team A</div>
      ${slots.a.map((s, i) => renderSlot('A', i, s)).join('')}
    </div>
    <div class="team-block team-b">
      <div class="team-label">Team B</div>
      ${slots.b.map((s, i) => renderSlot('B', i, s)).join('')}
    </div>
    <div class="field">
      <label>Play to</label>
      <div class="team-toggle" id="liveTargetToggle">
        <button data-target="11" class="${live.target===11?'active':''}">11</button>
        <button data-target="15" class="${live.target===15?'active':''}">15</button>
        <button data-target="21" class="${live.target===21?'active':''}">21</button>
      </div>
    </div>
    <button class="btn btn-primary" id="startLiveBtn">Start scoring</button>
  `;
}

function renderLiveBoard(){
  const winner = computeLiveWinner();
  const isDoublesFormat = live.type !== 'singles';
  const ballIcons = isDoublesFormat ? renderBallIcons(live.serverSlot) : '';
  const plainNamesA = live.teamA.map(id => escapeHtml(playerById(id)?.name || '—')).join(' &amp; ');
  const plainNamesB = live.teamB.map(id => escapeHtml(playerById(id)?.name || '—')).join(' &amp; ');

  return `
    <div class="section-title">Live · playing to ${live.target}</div>
    <div class="scoreboard">
      <div class="score-side">
        <div class="score-name">${formatSideNames(live.teamA)}</div>
        <div class="serve-slot-note">${live.serving==='A' ? ballIcons : ''}</div>
        <div class="score-value">${live.scoreA}</div>
        <button class="score-tap-btn" id="tapA" ${winner ? 'disabled' : ''}>Team A point</button>
      </div>
      <div class="score-side">
        <div class="score-name">${formatSideNames(live.teamB)}</div>
        <div class="serve-slot-note">${live.serving==='B' ? ballIcons : ''}</div>
        <div class="score-value">${live.scoreB}</div>
        <button class="score-tap-btn" id="tapB" ${winner ? 'disabled' : ''}>Team B point</button>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-ghost" style="margin-top:0;" id="undoPointBtn" ${live.history.length===0?'disabled':''}>Undo</button>
      <button class="btn btn-ghost" style="margin-top:0;" id="switchServeBtn">Switch serve</button>
    </div>
    ${winner ? `<div class="live-winner-banner">${winner==='A'?plainNamesA:plainNamesB} wins ${live.scoreA}–${live.scoreB}!</div>` : ''}
    <button class="btn ${winner ? 'btn-primary' : 'btn-ghost'}" id="finishLiveBtn" style="margin-top:${winner?'0':'16px'};">${winner ? 'Log this match' : 'End & log now'}</button>
    <button class="btn btn-ghost" id="cancelLiveBtn">Cancel match</button>
  `;
}

/* ---------- Add match ---------- */
function renderAddMatch(){
  if(state.players.length < 2){
    return emptyState('Need more players', 'Add at least two players before logging a match.', 'players');
  }
  const men = state.players.filter(p => p.gender === 'M');
  const women = state.players.filter(p => p.gender === 'F');
  const optAll = state.players.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  const optMen = men.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  const optWomen = women.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');

  if(matchTeamSize === 'mixed' && (men.length < 2 || women.length < 2)){
    return `
      <div class="team-toggle">
        <button data-size="singles" class="${matchTeamSize==='singles'?'active':''}">Singles</button>
        <button data-size="doubles" class="${matchTeamSize==='doubles'?'active':''}">Doubles</button>
        <button data-size="mixed" class="${matchTeamSize==='mixed'?'active':''}">Mixed</button>
      </div>
      ${emptyState('Need more players', 'Mixed doubles needs at least 2 men and 2 ladies. Add more players first.', 'players')}
    `;
  }

  const pre = matchPrefill;
  matchPrefill = null; // consume once

  let teamSlots;
  if(matchTeamSize === 'singles'){
    const preA = pre?.type === 'singles' ? pre.teamA?.[0] : null;
    const preB = pre?.type === 'singles' ? pre.teamB?.[0] : null;
    teamSlots = { a: [{label: null, options: optAll, selected: preA || null}], b: [{label: null, options: optAll, selected: preB || null}] };
  } else if(matchTeamSize === 'mixed'){
    teamSlots = {
      a: [{label: 'Men', options: optMen, selected: pre?.teamA?.M || null}, {label: 'Ladies', options: optWomen, selected: pre?.teamA?.F || null}],
      b: [{label: 'Men', options: optMen, selected: pre?.teamB?.M || null}, {label: 'Ladies', options: optWomen, selected: pre?.teamB?.F || null}]
    };
  } else {
    teamSlots = { a: [{label: null, options: optAll, selected: null}, {label: null, options: optAll, selected: null}], b: [{label: null, options: optAll, selected: null}, {label: null, options: optAll, selected: null}] };
  }

  const renderSlot = (team, i, slot) => {
    const optionsWithSelection = slot.selected
      ? slot.options.replace(`value="${slot.selected}"`, `value="${slot.selected}" selected`)
      : slot.options;
    return `
    <div class="field" style="margin-bottom:${i===teamSlots[team.toLowerCase()].length-1?'0':'10px'}">
      ${slot.label ? `<label style="margin-bottom:5px">${slot.label}</label>` : ''}
      <select data-team="${team}" data-slot="${i}">
        <option value="">Select player…</option>
        ${optionsWithSelection}
      </select>
    </div>
  `;
  };

  return `
    <div class="team-toggle">
      <button data-size="singles" class="${matchTeamSize==='singles'?'active':''}">Singles</button>
      <button data-size="doubles" class="${matchTeamSize==='doubles'?'active':''}">Doubles</button>
      <button data-size="mixed" class="${matchTeamSize==='mixed'?'active':''}">Mixed</button>
    </div>

    <div class="team-block team-a">
      <div class="team-label">Team A</div>
      ${teamSlots.a.map((slot, i) => renderSlot('A', i, slot)).join('')}
    </div>

    <div class="team-block team-b">
      <div class="team-label">Team B</div>
      ${teamSlots.b.map((slot, i) => renderSlot('B', i, slot)).join('')}
    </div>

    <div class="field">
      <label>Score</label>
      <div class="score-row">
        <input type="number" id="scoreA" placeholder="11" min="0" max="99">
        <div class="vs">–</div>
        <input type="number" id="scoreB" placeholder="7" min="0" max="99">
      </div>
    </div>

    <button class="btn btn-primary" id="submitMatchBtn">Log match</button>
  `;
}

/* ---------- History ---------- */
function renderHistory(){
  if(state.matches.length === 0){
    return emptyState('No matches yet', 'Logged matches will show up here.', 'addMatch');
  }
  const sorted = [...state.matches].sort((a,b)=> b.date - a.date);
  return `<div class="section-title">Match history</div>` + sorted.map(m => {
    const namesA = m.teamA.map(id => playerById(id)?.name || 'Removed player').join(' / ');
    const namesB = m.teamB.map(id => playerById(id)?.name || 'Removed player').join(' / ');
    const aWon = m.scoreA > m.scoreB;
    const d = new Date(m.date);

    if(editingMatchId === m.id){
      return `
        <div class="match-card">
          <div class="match-date">${d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'})} · ${m.type}</div>
          <div class="match-teams" style="margin-bottom:12px;">
            <div class="match-side">${escapeHtml(namesA)}</div>
            <div class="match-side" style="text-align:right">${escapeHtml(namesB)}</div>
          </div>
          <div class="score-row" style="margin-top:0;">
            <input type="number" id="editScoreA" value="${m.scoreA}" min="0" max="99">
            <div class="vs">–</div>
            <input type="number" id="editScoreB" value="${m.scoreB}" min="0" max="99">
          </div>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn btn-primary" style="margin-top:0;" data-save-match="${m.id}">Save</button>
            <button class="btn btn-ghost" style="margin-top:0;" data-cancel-edit>Cancel</button>
          </div>
        </div>
      `;
    }

    return `
      <div class="match-card">
        <div class="match-date">${d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'})} · ${m.type}${m.ratable === false ? ' · unrated (>1.0 gap)' : ''}</div>
        <div class="match-teams">
          <div class="match-side ${aWon?'winner':''}">${escapeHtml(namesA)}</div>
          <div class="match-score">${m.scoreA}–${m.scoreB}</div>
          <div class="match-side ${!aWon?'winner':''}" style="text-align:right">${escapeHtml(namesB)}</div>
        </div>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn btn-ghost small-btn" style="margin-top:0;" data-edit-match="${m.id}">Edit score</button>
          <button class="btn btn-ghost small-btn" style="margin-top:0; color:var(--coral); border-color:rgba(196,63,38,0.3);" data-delete-match="${m.id}">Delete</button>
        </div>
      </div>
    `;
  }).join('');
}

function emptyState(title, sub, jumpTo){
  return `
    <div class="empty">
      <div class="empty-title">${title}</div>
      <div>${sub}</div>
      <button class="btn btn-ghost" style="width:auto; padding:10px 20px; margin-top:16px;" data-jump="${jumpTo}">Go there</button>
    </div>
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- Render root ---------- */
function render(){
  if(view === 'liveScore' && !isAdmin) view = 'leaderboard'; // admin-only tab
  if(view === 'leaderboard') startLiveViewerPolling(); else stopLiveViewerPolling();

  renderTabs();
  const m = $('#main');
  if(!state.loaded){
    m.innerHTML = `<div class="empty"><div class="empty-title">Loading…</div></div>`;
    return;
  }
  if(view === 'leaderboard') m.innerHTML = renderLiveNowCard() + renderLeaderboard() + shareNote();
  else if(view === 'players') m.innerHTML = renderPlayers();
  else if(view === 'nextGames') m.innerHTML = renderNextGames();
  else if(view === 'liveScore') m.innerHTML = renderLiveScore();
  else if(view === 'addMatch') m.innerHTML = renderAddMatch();
  else if(view === 'history') m.innerHTML = renderHistory();

  bindMainEvents();
}

function shareNote(){
  return `<div class="shared-note">Shared with everyone using this site · export from the Players tab to back up</div>`;
}

function bindMainEvents(){
  const jumpBtn = document.querySelector('[data-jump]');
  if(jumpBtn){
    jumpBtn.onclick = () => { view = jumpBtn.dataset.jump; render(); };
  }

  const addPlayerBtn = $('#addPlayerBtn');
  if(addPlayerBtn){
    addPlayerBtn.onclick = async () => {
      const input = $('#newPlayerName');
      const name = input.value.trim();
      if(!name) return;
      state.players.push({
        id: uid(), name, gender: newPlayerGender,
        ratingDoubles: START_RATING, ratingSingles: START_RATING,
        matchesDoubles: 0, matchesSingles: 0,
        wins: 0, losses: 0, lastDelta: null, lastDeltaFormat: null
      });
      sessionPresentIds.add(state.players[state.players.length-1].id);
      addPlayerBtn.disabled = true;
      await saveData();
      addPlayerBtn.disabled = false;
      showToast(`${name} added`);
      input.value = '';
      render();
    };
  }

  const genderToggle = $('#genderToggle');
  if(genderToggle){
    genderToggle.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        newPlayerGender = btn.dataset.gender;
        genderToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      };
    });
  }

  const leaderboardModeToggle = $('#leaderboardModeToggle');
  if(leaderboardModeToggle){
    leaderboardModeToggle.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => { leaderboardMode = btn.dataset.mode; render(); };
    });
  }

  document.querySelectorAll('.team-toggle button[data-size]').forEach(btn => {
    btn.onclick = () => { matchTeamSize = btn.dataset.size; render(); };
  });

  const exportBtn = $('#exportBtn');
  if(exportBtn) exportBtn.onclick = exportData;

  const importBtn = $('#importBtn');
  const importFile = $('#importFile');
  if(importBtn && importFile){
    importBtn.onclick = () => importFile.click();
    importFile.onchange = () => {
      if(importFile.files && importFile.files[0]){
        importData(importFile.files[0]);
      }
    };
  }

  const toggleAdminBtn = $('#toggleAdminBtn');
  if(toggleAdminBtn){
    toggleAdminBtn.onclick = () => {
      if(isAdmin){
        setAdmin(false);
        showToast('Admin disabled on this device');
        render();
        return;
      }
      const entered = prompt('Enter admin password:');
      if(entered === null) return; // cancelled
      if(entered.trim().toLowerCase() === ADMIN_PASSWORD){
        setAdmin(true);
        showToast('Admin enabled on this device');
        render();
      } else {
        showToast('Incorrect password');
      }
    };
  }

  const liveNowCard = $('#liveNowCard');
  if(liveNowCard){
    liveNowCard.onclick = () => {
      if(!live.started && liveViewerData){
        resumeLiveFromRemote(liveViewerData); // e.g. after a page reload
      }
      view = 'liveScore';
      render();
    };
  }

  document.querySelectorAll('[data-presence]').forEach(cb => {
    cb.onchange = () => {
      const id = cb.dataset.presence;
      if(cb.checked) sessionPresentIds.add(id); else sessionPresentIds.delete(id);
    };
  });

  const courtsInput = $('#courtsInput');
  if(courtsInput){
    courtsInput.oninput = () => { sessionCourts = Math.max(1, parseInt(courtsInput.value, 10) || 1); };
  }

  const genModeToggle = $('#genModeToggle');
  if(genModeToggle){
    genModeToggle.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        sessionGenMode = btn.dataset.mode;
        sessionCourts = null; // recompute suggested max for the new mode
        currentSchedule = null;
        render();
      };
    });
  }

  const gameCountInput = $('#gameCountInput');
  if(gameCountInput){
    gameCountInput.oninput = () => { sessionGameCount = Math.max(1, parseInt(gameCountInput.value, 10) || 1); };
  }

  const generateBtn = $('#generateBtn');
  if(generateBtn) generateBtn.onclick = generateSchedule;

  const resetRotationBtn = $('#resetRotationBtn');
  if(resetRotationBtn){
    resetRotationBtn.onclick = () => {
      // Clears the pending (unplayed) proposed schedule — fairness still
      // resyncs to today's actually-logged games on the next generate.
      sessionAppearances = getTodaysAppearanceCounts();
      sessionRoundsHistory = [];
      currentSchedule = null;
      showToast('Rotation reset — resynced to today\u2019s logged games');
      render();
    };
  }

  document.querySelectorAll('[data-log-court]').forEach(btn => {
    btn.onclick = () => {
      const roundIndex = parseInt(btn.dataset.logRound, 10);
      const courtIndex = parseInt(btn.dataset.logCourt, 10);
      const round = currentSchedule[roundIndex];
      const court = round.courts[courtIndex];
      if(round.mode === 'singles'){
        matchPrefill = { type: 'singles', teamA: court.teamA, teamB: court.teamB };
        matchTeamSize = 'singles';
      } else {
        matchPrefill = { type: 'mixed', teamA: court.teamA, teamB: court.teamB };
        matchTeamSize = 'mixed';
      }
      pendingCourtSource = { roundIndex, courtIndex };
      view = 'addMatch';
      render();
    };
  });

  document.querySelectorAll('[data-start-live-court]').forEach(btn => {
    btn.onclick = () => {
      const roundIndex = parseInt(btn.dataset.startLiveRound, 10);
      const courtIndex = parseInt(btn.dataset.startLiveCourt, 10);
      const round = currentSchedule[roundIndex];
      const court = round.courts[courtIndex];
      pendingCourtSource = { roundIndex, courtIndex };
      startLiveFromCourt(round, court);
    };
  });

  document.querySelectorAll('[data-remove-player]').forEach(btn => {
    btn.onclick = () => removePlayer(btn.dataset.removePlayer);
  });

  document.querySelectorAll('[data-delete-match]').forEach(btn => {
    btn.onclick = () => deleteMatch(btn.dataset.deleteMatch);
  });

  const liveTypeToggle = $('#liveTypeToggle');
  if(liveTypeToggle){
    liveTypeToggle.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => { live.type = btn.dataset.livetype; render(); };
    });
  }

  const liveTargetToggle = $('#liveTargetToggle');
  if(liveTargetToggle){
    liveTargetToggle.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => { live.target = parseInt(btn.dataset.target, 10); render(); };
    });
  }

  const startLiveBtn = $('#startLiveBtn');
  if(startLiveBtn){
    startLiveBtn.onclick = () => {
      const selects = document.querySelectorAll('select[data-liveteam]');
      const teamA = [], teamB = [];
      selects.forEach(s => {
        if(!s.value) return;
        (s.dataset.liveteam === 'A' ? teamA : teamB).push(s.value);
      });
      const needed = live.type === 'singles' ? 1 : 2;
      if(teamA.length < needed || teamB.length < needed){
        showToast('Pick all players for both teams');
        return;
      }
      if(new Set([...teamA, ...teamB]).size !== teamA.length + teamB.length){
        showToast("A player can't be on both teams");
        return;
      }
      live.teamA = teamA;
      live.teamB = teamB;
      live.scoreA = 0;
      live.scoreB = 0;
      live.history = [];
      live.serving = 'A';
      live.serverPlayerIndex = 0;
      live.serverSlot = 2;
      live.started = true;
      render();
      syncLiveMatch();
    };
  }

  const tapA = $('#tapA');
  if(tapA) tapA.onclick = () => recordRally('A');
  const tapB = $('#tapB');
  if(tapB) tapB.onclick = () => recordRally('B');

  const undoPointBtn = $('#undoPointBtn');
  if(undoPointBtn) undoPointBtn.onclick = undoRally;

  const switchServeBtn = $('#switchServeBtn');
  if(switchServeBtn){
    switchServeBtn.onclick = () => { live.serving = live.serving === 'A' ? 'B' : 'A'; live.serverPlayerIndex = 0; live.serverSlot = 1; render(); syncLiveMatch(); };
  }

  const finishLiveBtn = $('#finishLiveBtn');
  if(finishLiveBtn){
    finishLiveBtn.onclick = () => {
      if(live.scoreA === live.scoreB){
        showToast("Scores can't be tied");
        return;
      }
      if(computeLiveWinner()){
        finishLiveMatch();
      } else if(confirm(`Log ${live.scoreA}–${live.scoreB} as the final score?`)){
        finishLiveMatch();
      }
    };
  }

  const cancelLiveBtn = $('#cancelLiveBtn');
  if(cancelLiveBtn){
    cancelLiveBtn.onclick = () => {
      if(confirm('Discard this live match? Nothing will be saved.')){
        pendingCourtSource = null;
        clearLiveMatchRemote();
        resetLive();
        render();
      }
    };
  }

  document.querySelectorAll('[data-edit-match]').forEach(btn => {
    btn.onclick = () => { editingMatchId = btn.dataset.editMatch; render(); };
  });

  const cancelEditBtn = document.querySelector('[data-cancel-edit]');
  if(cancelEditBtn){
    cancelEditBtn.onclick = () => { editingMatchId = null; render(); };
  }

  const saveMatchBtn = document.querySelector('[data-save-match]');
  if(saveMatchBtn){
    saveMatchBtn.onclick = async () => {
      const m = state.matches.find(mm => mm.id === saveMatchBtn.dataset.saveMatch);
      if(!m) return;
      const newA = parseInt($('#editScoreA').value, 10);
      const newB = parseInt($('#editScoreB').value, 10);
      if(isNaN(newA) || isNaN(newB) || newA === newB){
        showToast('Enter a valid, non-tied score');
        return;
      }
      m.scoreA = newA;
      m.scoreB = newB;
      recomputeRatings();
      saveMatchBtn.disabled = true;
      await saveData();
      saveMatchBtn.disabled = false;
      editingMatchId = null;
      showToast('Score updated');
      render();
    };
  }

  const submitBtn = $('#submitMatchBtn');
  if(submitBtn){
    submitBtn.onclick = async () => {
      const selects = document.querySelectorAll('select[data-team]');
      const teamA = [], teamB = [];
      selects.forEach(s => {
        if(!s.value) return;
        (s.dataset.team === 'A' ? teamA : teamB).push(s.value);
      });
      const scoreA = parseInt($('#scoreA').value, 10);
      const scoreB = parseInt($('#scoreB').value, 10);

      const needed = matchTeamSize === 'singles' ? 1 : 2;
      if(teamA.length < needed || teamB.length < needed){
        showToast('Pick all players for both teams');
        return;
      }
      if(new Set([...teamA, ...teamB]).size !== teamA.length + teamB.length){
        showToast("A player can't be on both teams");
        return;
      }
      if(isNaN(scoreA) || isNaN(scoreB) || scoreA === scoreB){
        showToast('Enter a valid, non-tied score');
        return;
      }

      state.matches.push({
        id: uid(),
        date: Date.now(),
        type: matchTeamSize,
        teamA, teamB, scoreA, scoreB
      });
      recomputeRatings();
      removePendingScheduleCourt();

      const justLogged = state.matches[state.matches.length - 1];
      const ratedToast = justLogged.ratable === false ? 'Match logged — rating gap over 1.0, no rating change' : 'Match logged';

      submitBtn.disabled = true;
      await saveData();
      submitBtn.disabled = false;
      showToast(ratedToast);
      view = 'leaderboard';
      render();
    };
  }
}

loadData();
</script>
</body>
</html>
